services:
  - type: web
    name: maccollab-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CALENDAR_ID
        value: maccollab25@gmail.com
      - key: SEND_EMAIL
        value: "true"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
